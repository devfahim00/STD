name: Build Android APK (arm64-v8a)

on:
  workflow_dispatch:
    inputs:
      version_name:
        description: "Version name (e.g. 1.0.0)"
        required: false
        default: "1.0.0"
      version_code:
        description: "Version code (integer, e.g. 1)"
        required: false
        default: "1"

jobs:
  build:
    name: Build arm64-v8a APK
    runs-on: ubuntu-latest

    steps:
      # ── 1. Checkout ───────────────────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4

      # ── 2. Java ───────────────────────────────────────────────────────────
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # ── 3. Flutter ────────────────────────────────────────────────────────
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.44.1"
          channel: stable
          cache: true

      # ── 4. Dependencies ───────────────────────────────────────────────────
      - name: Install Flutter dependencies
        run: flutter pub get

      # ── 5. Build APK (arm64-v8a only) ─────────────────────────────────────
      - name: Build release APK — arm64-v8a
        run: |
          flutter build apk \
            --release \
            --target-platform android-arm64 \
            --split-per-abi \
            --build-name="${{ github.event.inputs.version_name }}" \
            --build-number="${{ github.event.inputs.version_code }}"

      # ── 6. Rename APK ─────────────────────────────────────────────────────
      - name: Rename APK
        run: |
          mv build/app/outputs/flutter-apk/app-arm64-v8a-release.apk \
             build/app/outputs/flutter-apk/STD-v${{ github.event.inputs.version_name }}-arm64.apk

      # ── 7. Upload artifact ────────────────────────────────────────────────
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: STD-v${{ github.event.inputs.version_name }}-arm64
          path: build/app/outputs/flutter-apk/STD-v${{ github.event.inputs.version_name }}-arm64.apk
          retention-days: 30
